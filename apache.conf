<VirtualHost *:80>

    DocumentRoot /var/www/chamilo/public

    <Directory /var/www/chamilo/public>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/chamilo>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

</VirtualHost>
